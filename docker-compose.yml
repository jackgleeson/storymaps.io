services:
  app:
    image: storymaps-app
    build: .
    restart: unless-stopped
    volumes:
      - ./data:/app/data
    expose:
      - "8080"
    environment:
      # Caddy is the only way in, so trust its X-Forwarded-For for per-visitor rate limits
      - TRUST_PROXY=true

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  caddy_data:
  caddy_config:
